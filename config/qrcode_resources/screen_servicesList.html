<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>QSystem</title>
    <style>
   body{
    background-color: #DDDD00; /* Цвет фона веб-страницы */
   }
   h1 {
    background-color: RGB(90, 90, 90); /* Цвет фона под заголовком */
    color:  RGB(256, 256, 0);
    border-radius: 15px;
   }
   table {
    width: 500px; /* Ширина таблицы */
    border: 1px solid white; /* Рамка вокруг таблицы */
    margin: auto; /* Выравниваем таблицу по центру окна  */
    border-radius: 15px;
   }
   #buttonsTbl{
     width: 100%; /* Ширина таблицы */
     border: 3px solid white; /* Рамка вокруг таблицы */
     margin: auto; /* Выравниваем таблицу по центру окна  */
   }
   td {
    text-align: center; /* Выравниваем текст по центру ячейки */
    color:  RGB(0, 0, 0);
    font-size: 18pt;
   }
   #statedescr {
    text-align: right;
   }
   #numberTxt{
    text-align: right;
    color:  RGB(256, 0, 0);
    font-size: 36pt;
   }
   button{
   width: 250px;
   height: 70px;
   font-size: 21pt;
   border-radius: 15px;
   }
   .serbBtn{
     width: 100%; /* Ширина таблицы */
     height: 210px;
     border: 3px solid white; /* Рамка вокруг таблицы */
     border-radius: 60px;
     margin: auto; /* Выравниваем таблицу по центру окна  */
     margin-top: 20px;
     margin-bottom: 20px;
   }








    </style>
</head>
<body>
<h1>&nbsp;&nbsp;&nbsp;QSystem</h1>

{{#services}}
<button class="serbBtn" onclick="location.href='?{{#isLeaf}}serviceId{{/isLeaf}}{{^isLeaf}}rootId{{/isLeaf}}={{id}}'">{{{buttonText}}}</button>
{{/services}}
&nbsp;

<table id="buttonsTbl">
    <tr>
        <td>
            <button onClick="location.href='?rootId=root'">К началу</button>
        </td>
    </tr>
</table>


</body>
</html>
