<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>QSystem</title>
    <style>
   body{
    background-color: #DDDD00; /* Цвет фона веб-страницы */
   }
   h1 {
    background-color: RGB(90, 90, 90); /* Цвет фона под заголовком */
    color:  RGB(256, 256, 0);
   }
   table {
    width: 500px; /* Ширина таблицы */
    border: 1px solid white; /* Рамка вокруг таблицы */
    margin: auto; /* Выравниваем таблицу по центру окна  */
   }
   #buttonsTbl{
     width: 100%; /* Ширина таблицы */
     border: 3px solid white; /* Рамка вокруг таблицы */

   }
   td {
    text-align: center; /* Выравниваем текст по центру ячейки */
    color:  RGB(0, 0, 0);
    font-size: 18pt;
   }
   #statedescr {
    text-align: right;
   }
   #numberTxt{
    text-align: right;
    color:  RGB(256, 0, 0);
    font-size: 36pt;
   }
   #leftTxt{
    text-align: left;
    color:  RGB(250, 50, 50);
    font-size: 24pt;
   }




    </style>
</head>

    <tr>
        <td id="statedescr" colspan="2">Обратитесь к персоналу учреждения.</td>

</html>
